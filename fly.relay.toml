# Supply your own globally unique application with `fly deploy --app NAME`.
# Keeping an app name out of this shared file prevents accidental deployment to
# another operator's relay.
primary_region = "hel"

[build]
  dockerfile = "Dockerfile.relay"

[env]
  EXARCH_RELAY_TRUST_PROXY = "1"
  EXARCH_RELAY_STATE_PATH = "/data/relay-state.json"

[mounts]
  source = "exarch_relay_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
