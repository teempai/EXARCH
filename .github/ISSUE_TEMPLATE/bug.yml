name: Bug report
description: Report a reproducible EXARCH defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit vulnerabilities or secrets here. Use the private security-reporting instructions in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic projects and conversation data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: EXARCH revision
      description: Commit SHA or release identifier.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS/iOS version, device or Simulator, Node version, and affected harness.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed credentials, pairing codes, private repository content, personal paths, and raw conversation history.
          required: true
        - label: This is not a security vulnerability report.
          required: true
